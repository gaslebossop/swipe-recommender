name: Deploy swipe-recommender

# Déclenchement manuel uniquement, comme rust-recommender.yml — pas de
# déploiement automatique à chaque push sur un service qui touche la
# production. Ce workflow compile le jar SUR LE RUNNER GitHub Actions (JDK
# 21, comme le VPS) : aucune compilation n'est nécessaire sur le VPS
# lui-même, contrairement au recommandeur Rust.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Tests
        run: sbt -batch test

      - name: Empaquetage (sbt assembly)
        run: sbt -batch assembly

      - name: Localiser le jar
        id: jar
        run: echo "path=$(find target -name 'swipe-recommender.jar' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Envoyer le jar et redémarrer le service
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new \
            "debian@${{ secrets.VPS_HOST }}" "mkdir -p /home/debian/swipe-recommender"
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new \
            "${{ steps.jar.outputs.path }}" \
            "debian@${{ secrets.VPS_HOST }}:/home/debian/swipe-recommender/swipe-recommender.jar"
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new \
            "debian@${{ secrets.VPS_HOST }}" "sudo systemctl restart swipe-recommender"

      - name: Contrôle de santé
        run: |
          sleep 5
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new \
            "debian@${{ secrets.VPS_HOST }}" \
            "curl -sf --max-time 5 http://127.0.0.1:3005/health"
